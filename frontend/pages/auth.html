<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &amp; Register — VALENOR Horology</title>
  <meta name="description" content="Create your VALENOR collector account or sign in with your email or phone number.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body data-nav="account">
  <div id="shared-header-host"></div>

  <main class="auth-wrap">
    <section class="auth-card" aria-label="Customer Authentication">
      <div class="section-eyebrow" style="text-align:center;">Collector Access</div>
      <h1 style="font-family:var(--font-display);font-size:34px;text-align:center;margin:4px 0 20px;">VALENOR Account</h1>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab-btn active" data-auth-tab="login">Sign In</button>
        <button type="button" class="auth-tab-btn" data-auth-tab="register">Register</button>
        <button type="button" class="auth-tab-btn" data-auth-tab="forgot">Reset Password</button>
      </div>

      <div class="form-alert" id="auth-alert" role="alert"></div>

      <!-- LOGIN FORM -->
      <form id="form-login" class="form-grid" novalidate>
        <div class="field-group">
          <label for="login-identifier">Email or Phone Number</label>
          <input type="text" id="login-identifier" class="field-control" placeholder="e.g. collector@valenor.pk or +923001234567" required>
        </div>
        <div class="field-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="field-control" placeholder="Enter your password" required>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;">
          <label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;">
            <input type="checkbox" id="login-remember"> Remember me
          </label>
          <button type="button" id="btn-goto-forgot" style="background:none;border:0;color:var(--accent-gold);font-weight:600;padding:0;">Forgot password?</button>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In to Account</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="form-register" class="form-grid" style="display:none;" novalidate>
        <div class="field-group">
          <label for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" class="field-control" placeholder="e.g. Hamza Siddiqui" required>
        </div>
        <div class="field-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="field-control" placeholder="e.g. hamza@example.com" required>
        </div>
        <div class="field-group">
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="field-control" placeholder="e.g. +92 300 1234567" required>
        </div>
        <div class="form-grid-2">
          <div class="field-group">
            <label for="reg-password">Password (min 8 chars)</label>
            <input type="password" id="reg-password" class="field-control" minlength="8" required>
          </div>
          <div class="field-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" class="field-control" minlength="8" required>
          </div>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Create Account</button>
      </form>

      <!-- FORGOT / RESET PASSWORD FORM -->
      <div id="panel-forgot" style="display:none;">
        <form id="form-forgot-request" class="form-grid" novalidate>
          <div class="field-group">
            <label for="forgot-identifier">Registered Email or Phone</label>
            <input type="text" id="forgot-identifier" class="field-control" placeholder="Enter your email or phone number" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Code</button>
        </form>

        <form id="form-reset-confirm" class="form-grid" style="display:none;margin-top:16px;" novalidate>
          <div class="field-group">
            <label for="reset-token">Verification Code</label>
            <input type="text" id="reset-token" class="field-control" placeholder="Enter 6-digit code" required>
          </div>
          <div class="form-grid-2">
            <div class="field-group">
              <label for="reset-password">New Password</label>
              <input type="password" id="reset-password" class="field-control" minlength="8" required>
            </div>
            <div class="field-group">
              <label for="reset-confirm">Confirm Password</label>
              <input type="password" id="reset-confirm" class="field-control" minlength="8" required>
            </div>
          </div>
          <button type="submit" class="btn btn-gold" style="width:100%;">Update Password</button>
        </form>
      </div>
    </section>
  </main>

  <div id="shared-footer-host"></div>
  <div id="shared-overlays-host"></div>

  <script src="../assets/js/home-data.js"></script>
  <script src="../components/ui-components.js"></script>
  <script src="../assets/js/auth-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
