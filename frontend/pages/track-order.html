<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order &amp; Returns — VALENOR Horology</title>
  <meta name="description" content="Track your watch order milestones, cancel eligible orders, or submit a return request with photos.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body data-nav="track">
  <div id="shared-header-host"></div>

  <main>
    <section class="page-hero-strip">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="../index.html">Home</a> <span>/</span>
          <a href="account.html">My Account</a> <span>/</span>
          <span>Track Order</span>
        </nav>
        <h1 class="section-title">Order Tracking &amp; Returns</h1>
        <p class="section-subtitle">Monitor real-time delivery status, courier tracking numbers, cancellations, and 7-day return requests.</p>
      </div>
    </section>

    <section class="container" style="padding:36px 24px 72px;">
      <div class="tracker-card">
        <form id="track-lookup-form" style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;" novalidate>
          <div class="field-group" style="flex:1 1 240px;">
            <label for="lookup-order-num">Order Number</label>
            <input type="text" id="lookup-order-num" class="field-control" placeholder="e.g. VAL-2026-125133" required>
          </div>
          <div class="field-group" style="flex:1 1 240px;">
            <label for="lookup-contact">Order Email or Phone (for cancel / return actions)</label>
            <input type="text" id="lookup-contact" class="field-control" placeholder="Optional if already signed in">
          </div>
          <button type="submit" class="btn btn-primary" style="height:44px;">Track Order</button>
        </form>
        <div class="form-alert" id="track-alert" role="alert" style="margin-top:16px;margin-bottom:0;"></div>
      </div>

      <div id="tracker-result-host"></div>
    </section>
  </main>

  <div id="shared-footer-host"></div>
  <div id="shared-overlays-host"></div>

  <script src="../assets/js/home-data.js"></script>
  <script src="../components/ui-components.js"></script>
  <script src="../assets/js/auth-service.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/track-order.js"></script>
</body>
</html>
